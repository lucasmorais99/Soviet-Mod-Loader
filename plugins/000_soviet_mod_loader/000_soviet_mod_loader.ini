[loader]
enabled = 1
steam_app_id = 784150
workshop_root = auto
state_dir = soviet_mod_loader
copy_assets = 1
load_hooks = 1
log_verbose = 0
confirmation_mode = changes

; Confirmation policy: changes (default), always, or never. Use never for
; unattended launches or as a recovery option if Windows cannot show dialogs.

; The four capabilities below are compiled into this DLL. This writes their
; external DLL keys to 0 in tesmioloader.ini, preventing duplicate hooks.
disable_external_plugins = 1
embedded_plugins = 1

; Conflict policy is deterministic: dependencies first, then priority,
; Workshop addition time, and finally mod id. The later entry wins.
conflict_policy = later-wins
