[mod]
id = org.example.soviet.simple-industry
name = Simple Industry Example
version = 1.0.0
enabled = 1
priority = 0
tesmio_api_min = 3
tesmio_api_max = 3

; Dependencies are mod id = semantic-version constraint.
[dependencies]
; org.example.shared-library = >=1.2.0

[content]
resources = tesmio\resources.ini
deposits = tesmio\deposits.ini
needs = tesmio\needs.ini
buildings = tesmio\buildings.ini
assets = assets

; Repeat dll for each optional native Tesmio plugin shipped by this mod.
; Its TsmPluginInit runs during Soviet Mod Loader Init and TsmPluginStart runs
; after every regular Tesmio plugin has completed Init.
[hooks]
; dll = hooks\simple_hook.dll
